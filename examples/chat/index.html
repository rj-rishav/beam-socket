<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeamSocket chat</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 18px; font-weight: 600; }
  #log { border: 1px solid #8884; border-radius: 8px; height: 340px; overflow-y: auto; padding: 12px; margin: 12px 0; }
  .msg { margin: 4px 0; }
  .sys { opacity: 0.6; font-style: italic; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px 10px; border: 1px solid #8884; border-radius: 8px; font: inherit; }
  button { padding: 8px 14px; border: 1px solid #8886; border-radius: 8px; background: transparent; cursor: pointer; font: inherit; }
  #status { font-size: 13px; opacity: 0.7; }
</style>
</head>
<body>
  <h1>BeamSocket chat</h1>
  <div id="status">connecting…</div>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" placeholder="say something…" autocomplete="off" />
    <button type="submit">send</button>
  </form>
<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const add = (text, cls) => {
    const d = document.createElement('div');
    d.className = 'msg ' + (cls || '');
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  };

  const ws = new WebSocket('ws://localhost:8080');
  ws.onopen = () => { status.textContent = 'connected'; };
  ws.onclose = () => { status.textContent = 'disconnected'; };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { m = { text: String(e.data) }; }
    if (m.sys) add(m.sys, 'sys');
    else add(m.text ?? String(e.data));
  };

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ text }));
    input.value = '';
  });
</script>
</body>
</html>
