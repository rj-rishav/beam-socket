# RFC 0002 de-risking spike — THROWAWAY, Linux + plaintext only.
# Its own workspace on purpose (not a member of spike/Cargo.toml): it proves the
# Node fd-handoff mechanic and nothing else. Not built in CI.
[workspace]

[package]
name = "attach-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
libc = "0.2"

[build-dependencies]
napi-build = "2"
