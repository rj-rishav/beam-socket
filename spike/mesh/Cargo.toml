# RFC 0004 mesh spike — SEPARATE workspace from the repo root ON PURPOSE
# (the RFC 0001 precedent): this code is throwaway-grade; only conclusions
# and constants graduate. NO dependency on the real engine/SDK/bridge.
[workspace]

[package]
name = "mesh-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
debug = true
