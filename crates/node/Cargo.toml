[package]
name = "beamsocket-node"
version = "0.0.0"
edition = "2021"
description = "NAPI-RS binding. Translation only — logic belongs in beamsocket-core."

[lib]
# Phase 1A: cdylib is the Node addon; rlib keeps `cargo test --workspace`
# linking the pure-Rust parts (wire format, buffer strategy) without Node
# symbols. The napi surface only exists under `--features napi` (see below).
crate-type = ["cdylib", "rlib"]

[features]
# The napi/TSFN binding surface. OFF by default so CI's `cargo test --workspace`
# and `cargo clippy --workspace` never try to link Node symbols (napi_* is only
# resolvable inside a Node process). The addon is built with:
#   cargo build -p beamsocket-node --release --features napi
default = []
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
beamsocket-core = { path = "../core" }
bytes = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
napi = { version = "2", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "2", optional = true }

# Phase 1.1 attach: dup()/close() of the Node upgrade fd (Unix only — Windows
# fd handoff is deferred, RFC 0002 §7). Used only under `--features napi`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[build-dependencies]
napi-build = "2"
