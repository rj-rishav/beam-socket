[package]
name = "beamsocket-core"
version = "0.0.0"
edition = "2021"
description = "BeamSocket engine — the Rust data plane. Never imports NAPI."

[dependencies]
# Phase 1A (docs/ENGINEERING.md §5):
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# 0.26+ carries payloads as refcounted Bytes end-to-end — required for the
# Phase 1B one-allocation broadcast contract (ENGINEERING.md §6).
tokio-tungstenite = "0.29"
slab = "0.4"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
# Phase 1B (rooms — sharded registry):
dashmap = "6"

[dev-dependencies]
proptest = "1" # Phase 1B membership property tests
# criterion = "0.5"   # micro-benchmarks
