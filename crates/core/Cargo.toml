[package]
name = "beamsocket-core"
version = "0.0.0"
edition = "2021"
description = "BeamSocket engine — the Rust data plane. Never imports NAPI."

[dependencies]
# Phase 1A (docs/ENGINEERING.md §5):
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.24"
slab = "0.4"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
# Staged for Phase 1B (rooms — sharded registry):
# dashmap = "6"

[dev-dependencies]
# proptest = "1"      # Phase 1B property tests
# criterion = "0.5"   # micro-benchmarks
